<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Teacher Conference Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container"></main>
     <h1 class="title center">Parent Teacher Conference Form</h1>
     <p class="description center">Please fill out the form below to help schedule your parent-teacher conference.</p>
     <form>
        <fieldset>
            <legend>Student Information</legend>
            <label for="student-name">Full Name: </label>
            <input
                type="text"
                name="student-name"
                id="student-name"
                required
                placeholder="E.g, Jane Doe"/>
                <label for="grade">Student Grade: </label>
                <input
                type="number"
                name="grade"
                id="grade"
                placeholder="E.g., 4"
                required/>
        </fieldset>
        <fieldset>
            <legend>Parent/Guardian Information</legend>
            <label for="parent-name">Parent/Guardian Name: </label>
            <input
            type="text"
            name="parent-name"
            id="parent-name"
            required
            placeholder="E.g., Nancy Doe"
            />
        </fieldset>
      
      <fieldset>
        <legend>Preferred Contact Method</legend>
        <label class="contact-method" for="email">Email: </label>
        <input
            id="email"
            class="contact-method-radio-btn"
            type="radio"
            name="contact-method"
            value="email"
            checked
          />
        
      </fieldset>
     </form>
</body>
</html>
